name: E2E Smoke

# Required repo secrets:
#   SMOKE_BASE_URL          — OPTIONAL override. Defaults to the canonical
#                             production URL https://www.founders.click.
#                             (It previously named a Lovable preview host, which
#                             is not authoritative for this app — see
#                             deploy-app.yml.)
#   SUPABASE_TEST_EMAIL     — pre-confirmed test account (optional; signup-only path runs without)
#   SUPABASE_TEST_PASSWORD  — password for that account


# SCHEDULE DISABLED 2026-09-24 (Emailit bounce containment).
# Every scheduled run signed up smoke<ts>@example.com on production and the
# confirmation email bounced at Emailit — two bounces per six-hour window for
# weeks. The `schedule` and `push` triggers are gone; this runs by hand only.
# The app now refuses to email reserved/test addresses at all
# (src/lib/email-recipient-policy.ts), so a manual run is harmless, but do not
# re-add a schedule without a non-bouncing recipient strategy.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run smoke test
        env:
          # The production URL is PUBLIC and must not depend on a secret being
          # set. It did: an unset SMOKE_BASE_URL arrives as an empty string, so
          # every run died in page.goto("/") with "Cannot navigate to invalid
          # URL" and the smoke signal was dead while still looking configured.
          # The secret now only OVERRIDES the canonical production URL, which is
          # the same one deploy-app.yml smokes and production-monitor.yml watches.
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://www.founders.click' }}
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: python tests/e2e/smoke.py


      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/browser/smoke/
          if-no-files-found: ignore

