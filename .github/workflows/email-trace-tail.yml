name: Email trace (tail Worker logs)

# Read-only diagnostic: streams the founders-click Worker's console output for
# a bounded window so the EmailIt API response to a signup/reset/ticket send
# can be seen. The code logs status + message only, never keys or bodies.
# Dispatch from any branch; changes nothing in production.

on:
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-lamport-li8bun]
    paths: [".github/email-trace-trigger"]

env:
  TAIL_SECONDS: "300"

concurrency:
  group: email-trace-tail
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Tail founders-click for the window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "tail window: ${TAIL_SECONDS}s starting $(date -u +%FT%TZ)"
          timeout "${TAIL_SECONDS}" bunx wrangler tail founders-click --format json > /tmp/tail.jsonl 2> /tmp/tail.err
          echo "wrangler exit: $?"
          echo "--- stderr (auth/permission problems show here) ---"
          head -40 /tmp/tail.err
          echo "--- events: $(wc -l < /tmp/tail.jsonl) ---"
          # Print every console line the Worker logged plus the request URL path
          # for events that logged anything about email or the auth hook.
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync("/tmp/tail.jsonl","utf8").split("\n").filter(Boolean);
            const hist = {}; let shown = 0; const sanitized = [];
            const ts = (e) => { const d = new Date(e.eventTimestamp || 0); return isNaN(d) ? "(no-ts)" : d.toISOString(); };
            for (const l of lines) {
              let e; try { e = JSON.parse(l); } catch { continue; }
              const req = e.event && e.event.request; const url = (req && req.url) || "";
              let host = "", path = "";
              try { const u = new URL(url); host = u.host; path = u.pathname; } catch {}
              const logs = (e.logs||[]).map(x => (x.message||[]).map(m => typeof m === "string" ? m : JSON.stringify(m)).join(" "));
              const ua = (req && req.headers && (req.headers["user-agent"] || req.headers["User-Agent"])) || "";
              const kind = req ? "fetch" : (e.event && e.event.cron ? "cron" : (e.event && e.event.scheduledTime ? "scheduled" : "other"));
              const key = kind + " " + host + " " + (req ? req.method : "-") + " " + path.replace(/[0-9a-f-]{20,}/g, ":id").slice(0,60);
              hist[key] = (hist[key] || 0) + 1;
              sanitized.push({ t: ts(e), outcome: e.outcome, kind, method: req ? req.method : null, host, path: path.slice(0,120), ua: ua.slice(0,60), logs: logs.map(m => m.slice(0,500)), exceptions: (e.exceptions||[]).map(x => (x.name||"")+": "+(x.message||"").slice(0,300)) });
              const interesting = logs.some(m => /\[email\]|\[auth-send-email\]|emailit|\[help\]|welcome|ticket/i.test(m))
                || /hooks\/auth-send-email/.test(path) || /supabase|gotrue|webhook/i.test(ua) || (host && !/^www\.founders\.click$/.test(host)) || (e.exceptions||[]).length > 0 || (e.outcome && e.outcome !== "ok");
              if (!interesting) continue;
              shown++;
              console.log(`${ts(e)} ${e.outcome} ${kind} ${req ? req.method : ""} ${host}${path.slice(0,80)} ua=${ua.slice(0,40)}`);
              for (const m of logs) console.log("   log:", m.slice(0,400));
              for (const x of (e.exceptions||[])) console.log("   exception:", (x.name||"")+": "+(x.message||"").slice(0,300));
            }
            fs.writeFileSync("/tmp/tail-sanitized.json", JSON.stringify(sanitized, null, 1));
            console.log(`--- ${shown} notable events shown of ${lines.length} ---`);
            console.log("--- request histogram (kind host method path) ---");
            for (const [k,v] of Object.entries(hist).sort((a,b)=>b[1]-a[1]).slice(0,50)) console.log(String(v).padStart(5), k);
          '
      - name: Upload sanitized tail (no headers, no bodies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tail-sanitized
          path: /tmp/tail-sanitized.json
          retention-days: 7
